<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .wordmark { font-family: Georgia, 'Times New Roman', serif; }
      .tagline, .chip-text { font-family: Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="#0A0A0A"/>

  <!-- Subtle bottom hairline -->
  <line x1="0" y1="319" x2="1200" y2="319" stroke="#262626" stroke-width="1"/>

  <!-- Faint corner accent lines -->
  <line x1="0" y1="0" x2="0" y2="60" stroke="#262626" stroke-width="1"/>
  <line x1="0" y1="0" x2="60" y2="0" stroke="#262626" stroke-width="1"/>
  <line x1="1200" y1="320" x2="1200" y2="260" stroke="#262626" stroke-width="1"/>
  <line x1="1200" y1="320" x2="1140" y2="320" stroke="#262626" stroke-width="1"/>

  <!-- Logo mark -->
  <g transform="translate(100, 110)">
    <path d="M25 0L50 25L25 50L0 25Z" fill="none" stroke="#4ADE94" stroke-width="2"/>
    <circle cx="25" cy="25" r="6" fill="#4ADE94"/>
  </g>

  <!-- Wordmark -->
  <text x="175" y="150" class="wordmark" font-size="56" fill="#F2F2F2">NextHunt</text>

  <!-- Tagline -->
  <text x="100" y="200" class="tagline" font-size="18" fill="#8F8F8F">Every application, exactly where it stands.</text>

  <!-- Tech chips -->
  <g transform="translate(100, 230)">
    <!-- Next.js -->
    <rect x="0" y="0" width="78" height="28" rx="5" fill="none" stroke="#262626" stroke-width="1"/>
    <text x="12" y="19" class="mono" font-size="12" fill="#8F8F8F">Next.js</text>

    <!-- Prisma -->
    <rect x="90" y="0" width="72" height="28" rx="5" fill="none" stroke="#262626" stroke-width="1"/>
    <text x="102" y="19" class="mono" font-size="12" fill="#8F8F8F">Prisma</text>

    <!-- MySQL -->
    <rect x="174" y="0" width="76" height="28" rx="5" fill="none" stroke="#262626" stroke-width="1"/>
    <text x="186" y="19" class="mono" font-size="12" fill="#8F8F8F">MySQL</text>

    <!-- Tailwind -->
    <rect x="262" y="0" width="90" height="28" rx="5" fill="none" stroke="#262626" stroke-width="1"/>
    <text x="274" y="19" class="mono" font-size="12" fill="#8F8F8F">Tailwind</text>

    <!-- better-auth -->
    <rect x="364" y="0" width="112" height="28" rx="5" fill="none" stroke="#262626" stroke-width="1"/>
    <text x="376" y="19" class="mono" font-size="12" fill="#8F8F8F">better-auth</text>
  </g>

  <!-- Right-side faint pipeline motif -->
  <g transform="translate(880, 60)" opacity="0.9">
    <rect x="0" y="0" width="70" height="36" rx="6" fill="#141414" stroke="#262626" stroke-width="1"/>
    <rect x="0" y="46" width="70" height="36" rx="6" fill="#141414" stroke="#262626" stroke-width="1"/>
    <rect x="90" y="23" width="70" height="36" rx="6" fill="#141414" stroke="rgba(74,222,148,0.4)" stroke-width="1.2"/>
    <rect x="90" y="69" width="70" height="36" rx="6" fill="#141414" stroke="#262626" stroke-width="1"/>
    <rect x="180" y="46" width="70" height="36" rx="6" fill="rgba(74,222,148,0.08)" stroke="rgba(74,222,148,0.3)" stroke-width="1.2"/>
    <circle cx="107" cy="41" r="3" fill="#4ADE94"/>
  </g>
</svg>
